<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="共同家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111816" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>共同家計簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div class="busybar" aria-hidden="true"><i></i></div>
<div class="app">
  <header class="top">
    <h1>
      <svg viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" fill="#2F6F5E"/><path d="M512 220 L830 490 Q850 510 822 515 L202 515 Q174 510 194 490 Z" fill="#E8866A" stroke="#E8866A" stroke-width="40" stroke-linejoin="round"/><rect x="250" y="490" width="524" height="380" rx="60" fill="#FFFAF3"/><rect x="300" y="560" width="180" height="180" rx="40" fill="#FFD98A"/><rect x="544" y="560" width="180" height="180" rx="40" fill="#FFD98A"/><path d="M330 740 C330 640 360 610 390 610 C420 610 450 640 450 740 Z" fill="#5BAE8F"/><path d="M574 740 C574 650 604 615 634 615 C664 615 694 650 694 740 Z" fill="#F2A36B"/></svg>
      共同家計簿
    </h1>
    <div class="mswitch" aria-label="表示する月">
      <button type="button" id="mPrev" aria-label="前の月">‹</button><b id="mLabel" class="num"></b><button type="button" id="mNext" aria-label="次の月">›</button>
    </div>
    <button type="button" class="iconbtn" id="openSettings" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    </button>
  </header>

  <div class="empty" id="boot">読み込み中…</div>

  <!-- ホーム -->
  <section class="view" id="v-home" aria-label="ホーム">
    <div class="hero" id="homeHero"></div>
    <div class="panel" id="homeBudget"></div>
    <div class="panel" id="homeUpcoming"></div>
    <div class="panel" id="homeFeed"></div>
  </section>

  <!-- 記録 -->
  <section class="view" id="v-records" aria-label="記録">
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="内容・メモで探す" autocomplete="off"></label>
    <div class="chips" id="fPayer"></div>
    <div class="chips scroll" id="fCat"></div>
    <div class="sumline" id="recSum"></div>
    <div class="panel" style="padding-block:4px 6px"><div class="list" id="recList"></div></div>
  </section>

  <!-- 分析 -->
  <section class="view" id="v-analysis" aria-label="分析">
    <div class="kpis" id="anKpis"></div>
    <div class="panel"><h2 class="sec">月ごとの支出<small>直近6か月</small></h2><div id="anTrend"></div></div>
    <div class="panel" id="anBudget"></div>
    <div class="panel" id="anSplit"></div>
    <div class="panel" id="anCompare"></div>
  </section>

  <!-- 精算 -->
  <section class="view" id="v-settle" aria-label="精算">
    <div class="hero" id="stHero"></div>
    <div class="panel" id="stCalc"></div>
    <div class="panel" id="stHistory"></div>
    <div class="panel" id="stMonths"></div>
  </section>
</div>

<nav class="tabs" aria-label="画面の切り替え"><div class="in">
  <button type="button" data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button type="button" data-v="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>記録</button>
  <button type="button" class="plus" id="plusBtn" aria-label="記録を追加"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button type="button" data-v="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>分析</button>
  <button type="button" data-v="settle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>精算</button>
</div></nav>

<div class="scrim" id="scrim" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<div class="gate" id="gate" hidden>
  <img src="icons/apple-touch-icon.png" alt="">
  <h1>共同家計簿</h1>
  <p id="gateMsg">Googleアカウントでログインしてください。</p>
  <div id="gbtn"></div>
  <button class="link" id="altLogin" type="button">うまくいかないときは、ページを移動してログイン</button>
  <p id="gateNote" hidden>LINEなどのアプリの中で開くと、ログインできません。Safari で開き直してください。</p>
</div>

<script src="config.js"></script>
<script src="assets/app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="kkGisReady()"></script>
</body>
</html>
